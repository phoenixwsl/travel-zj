<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">浙江亲子自驾 · 7天6晚路线图</title>
  <desc id="desc">杭州经宁波、温州、苍南、缙云、古堰画乡、松阳、衢州返回杭州，标注每段公里数与车程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset="1" stop-color="#edf4ef"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eee7d2"/><stop offset="1" stop-color="#dce9d4"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17383e" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6d78"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183a40}.muted{fill:#687d7e}.title{font-size:38px;font-weight:820}.subtitle{font-size:17px}.city{font-size:22px;font-weight:800}.poi{font-size:15px;fill:#5b7072}.day{font-size:17px;font-weight:780}.small{font-size:14px}.km{font-size:22px;font-weight:850}.time{font-size:16px;font-weight:700;fill:#5d7375}.glow{fill:none;stroke:#fff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;opacity:.96}.route{fill:none;stroke:#1f6d78;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.node{stroke:#fff;stroke-width:5}.labelbox{fill:#fffdf8;stroke:#d7e2dd;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="54" y="62" class="title">浙江亲子自驾 · 7天6晚</text>
  <text x="55" y="96" class="subtitle muted">杭州 → 宁波 → 温州 → 苍南 → 缙云 → 古堰画乡 → 松阳 → 衢州 → 杭州</text>

  <g transform="translate(42 130)">
    <rect width="1020" height="740" rx="30" fill="#e8f2f2" filter="url(#shadow)"/>
    <path d="M20 20 H690 C760 47 850 85 924 158 C963 197 974 250 965 313 C955 385 918 431 890 484 C848 564 805 646 777 720 H20 Z" fill="url(#land)"/>
    <text x="38" y="43" class="small muted">北 ↑　相对地理位置示意</text>

    <path class="glow" d="M518 110 C650 102 780 128 908 188"/><path class="glow" d="M908 188 C860 302 770 424 668 536"/><path class="glow" d="M668 536 C650 576 628 610 591 628"/><path class="glow" d="M591 628 C575 548 542 468 497 417"/><path class="glow" d="M497 417 C463 461 425 504 401 512 C369 525 349 487 326 458"/><path class="glow" d="M326 458 C272 434 218 398 155 365"/><path class="glow" d="M155 365 C260 260 384 173 518 110"/>
    <path class="route" d="M518 110 C650 102 780 128 908 188"/><path class="route" d="M908 188 C860 302 770 424 668 536"/><path class="route" d="M668 536 C650 576 628 610 591 628"/><path class="route" d="M591 628 C575 548 542 468 497 417"/><path class="route" d="M497 417 C463 461 425 504 401 512 C369 525 349 487 326 458"/><path class="route" d="M326 458 C272 434 218 398 155 365"/><path class="route" d="M155 365 C260 260 384 173 518 110"/>

    <g transform="translate(648 58)" filter="url(#shadow)"><rect class="labelbox" width="176" height="68" rx="16"/><text x="88" y="29" text-anchor="middle" class="km">155 km</text><text x="88" y="52" text-anchor="middle" class="time">约 2h</text></g>
    <g transform="translate(786 300)" filter="url(#shadow)"><rect class="labelbox" width="188" height="68" rx="16"/><text x="94" y="29" text-anchor="middle" class="km">269 km</text><text x="94" y="52" text-anchor="middle" class="time">约 4h</text></g>
    <g transform="translate(690 590)" filter="url(#shadow)"><rect class="labelbox" width="165" height="68" rx="16"/><text x="82" y="29" text-anchor="middle" class="km">66 km</text><text x="82" y="52" text-anchor="middle" class="time">约 1.1h</text></g>
    <g transform="translate(594 463)" filter="url(#shadow)"><rect class="labelbox" width="218" height="68" rx="16"/><text x="109" y="29" text-anchor="middle" class="km">240—270 km</text><text x="109" y="52" text-anchor="middle" class="time">约 3.5—4h</text></g>
    <g transform="translate(342 570)" filter="url(#shadow)"><rect class="labelbox" width="230" height="72" rx="16"/><text x="115" y="29" text-anchor="middle" class="km">145—160 km</text><text x="115" y="54" text-anchor="middle" class="time">含古堰画乡 · 2.5—3h</text></g>
    <g transform="translate(174 477)" filter="url(#shadow)"><rect class="labelbox" width="172" height="68" rx="16"/><text x="86" y="29" text-anchor="middle" class="km">121 km</text><text x="86" y="52" text-anchor="middle" class="time">约 1.6h</text></g>
    <g transform="translate(272 220)" filter="url(#shadow)"><rect class="labelbox" width="178" height="68" rx="16"/><text x="89" y="29" text-anchor="middle" class="km">225 km</text><text x="89" y="52" text-anchor="middle" class="time">常态约 2.8h</text></g>

    <g transform="translate(518 110)"><circle class="node" r="25" fill="#183a40"/><text y="7" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">1</text></g><text x="445" y="72" class="city">杭州</text>
    <g transform="translate(908 188)"><circle class="node" r="27" fill="#e6aa52"/><text y="7" text-anchor="middle" font-size="19" font-weight="800">2</text></g><text x="780" y="156" class="city">宁波</text>
    <g transform="translate(668 536)"><circle class="node" r="27" fill="#ef8d68"/><text y="7" text-anchor="middle" font-size="19" font-weight="800">3</text></g><text x="704" y="536" class="city">温州</text>
    <g transform="translate(591 628)"><circle class="node" r="27" fill="#ef6f55"/><text y="7" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">4</text></g><text x="618" y="674" class="city">苍南</text>
    <g transform="translate(497 417)"><circle class="node" r="27" fill="#76956b"/><text y="7" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">5</text></g><text x="528" y="400" class="city">缙云</text>
    <g transform="translate(401 512)"><rect x="-8" y="-8" width="16" height="16" rx="3" fill="#1f6d78" stroke="#fff" stroke-width="3" transform="rotate(45)"/></g><text x="349" y="548" class="poi" font-weight="760">古堰画乡</text>
    <g transform="translate(326 458)"><circle class="node" r="27" fill="#7d9d6e"/><text y="7" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">6</text></g><text x="255" y="418" class="city">松阳</text>
    <g transform="translate(155 365)"><circle class="node" r="27" fill="#8b7858"/><text y="7" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">7</text></g><text x="82" y="326" class="city">衢州</text>
  </g>

  <g transform="translate(1090 130)">
    <rect width="470" height="740" rx="30" fill="#fffdf8" filter="url(#shadow)"/>
    <text x="28" y="48" font-size="25" font-weight="820">7天转场</text>
    <g transform="translate(28 92)"><text class="day">D1　杭州 → 宁波</text><text y="27" class="poi">155 km · 约2h</text></g>
    <g transform="translate(28 168)"><text class="day">D2　宁波 → 温州</text><text y="27" class="poi">269 km · 约4h</text></g>
    <g transform="translate(28 244)"><text class="day">D3　温州 → 苍南</text><text y="27" class="poi">66 km · 约1.1h</text></g>
    <g transform="translate(28 320)"><text class="day">D4　苍南 → 缙云</text><text y="27" class="poi">240—270 km · 约3.5—4h</text></g>
    <g transform="translate(28 396)"><text class="day">D5　缙云 → 古堰画乡 → 松阳</text><text y="27" class="poi">145—160 km · 约2.5—3h</text></g>
    <g transform="translate(28 472)"><text class="day">D6　松阳 → 衢州</text><text y="27" class="poi">121 km · 约1.6h</text></g>
    <g transform="translate(28 548)"><text class="day">D7　衢州 → 杭州</text><text y="27" class="poi">225 km · 常态约2.8h</text></g>
    <g transform="translate(24 626)"><rect width="422" height="82" rx="18" fill="#fff7df" stroke="#e2c990"/><text x="18" y="30" font-size="16" font-weight="780">10月1日返杭：实时路况优先</text><text x="18" y="56" class="small muted">浙南168和景区道路另计里程</text></g>
  </g>
</svg>
