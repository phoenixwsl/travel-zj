<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">浙江亲子自驾 · 7天6晚</title>
  <desc id="desc">2026年9月25日至10月1日，从杭州出发，经宁波、温州、苍南、缙云、松阳、衢州返回杭州。</desc>
  <rect width="1600" height="900" fill="#f8f5ed"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#183a40}
    .city{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#687d7e}.day{font-size:18px;font-weight:700}
    .route{fill:none;stroke:#1f6d78;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.dot{stroke:#fff;stroke-width:5}
  </style>
  <text x="60" y="65" font-size="38" font-weight="800">浙江亲子自驾 · 7天6晚</text>
  <text x="60" y="98" class="sub">2026.09.25—10.01｜宁波人文 · 温州烟火 · 苍南海岸 · 仙都山水 · 松阳古村 · 衢州南孔</text>
  <path class="route" d="M210 205 C450 130 730 140 1010 240 C860 370 710 500 610 620 C600 700 510 745 390 670 C300 590 260 470 300 365 C275 300 245 245 210 205"/>

  <g><circle class="dot" cx="210" cy="205" r="25" fill="#183a40"/><text x="80" y="205" class="city">杭州</text><text x="80" y="230" class="sub">D1出发 / D7返回</text></g>
  <g><circle class="dot" cx="1010" cy="240" r="27" fill="#e6aa52"/><text x="1055" y="230" class="city">宁波 · 1晚</text><text x="1055" y="258" class="sub">天一阁 · 东钱湖 · 韩岭</text></g>
  <g><circle class="dot" cx="610" cy="620" r="27" fill="#ef8d68"/><text x="650" y="605" class="city">温州 · 1晚</text><text x="650" y="633" class="sub">公园路 / 五马街 · 江心屿</text></g>
  <g><circle class="dot" cx="600" cy="700" r="27" fill="#ef6f55"/><text x="650" y="695" class="city">苍南 · 1晚</text><text x="650" y="723" class="sub">浙南168短段 · 海边日落</text></g>
  <g><circle class="dot" cx="390" cy="670" r="27" fill="#76956b"/><text x="120" y="680" class="city">缙云 · 1晚</text><text x="120" y="708" class="sub">仙都 · 朱潭山 · 倪翁洞</text></g>
  <g><circle class="dot" cx="300" cy="365" r="27" fill="#7d9d6e"/><text x="340" y="355" class="city">松阳 · 1晚</text><text x="340" y="383" class="sub">古堰画乡 · 老街 · 古村</text></g>
  <g><circle class="dot" cx="260" cy="470" r="27" fill="#8b7858"/><text x="40" y="475" class="city">衢州 · 1晚</text><text x="40" y="503" class="sub">水亭门 · 南孔 · 博物馆</text></g>

  <g transform="translate(1110 300)">
    <rect width="420" height="420" rx="28" fill="#fff" stroke="#dce6df"/>
    <text x="28" y="45" font-size="25" font-weight="800">7天行程</text>
    <text x="28" y="88" class="day">D1  杭州 → 宁波</text>
    <text x="28" y="132" class="day">D2  宁波 → 温州</text>
    <text x="28" y="176" class="day">D3  温州 → 苍南</text>
    <text x="28" y="220" class="day">D4  苍南 → 缙云</text>
    <text x="28" y="264" class="day">D5  缙云 → 松阳</text>
    <text x="28" y="308" class="day">D6  松阳 → 衢州</text>
    <text x="28" y="352" class="day">D7  衢州 → 杭州</text>
    <text x="28" y="395" class="sub">10/1返杭：实时路况优先于上午景点</text>
  </g>

  <g transform="translate(850 58)">
    <rect width="520" height="82" rx="18" fill="#fff7df" stroke="#e2c990"/>
    <text x="260" y="31" text-anchor="middle" font-size="17" font-weight="700">旅行主线：美食 · 自然风光 · 人文</text>
    <text x="260" y="58" text-anchor="middle" class="sub">每天一个核心体验，不赶路、不刷景点</text>
  </g>
</svg>