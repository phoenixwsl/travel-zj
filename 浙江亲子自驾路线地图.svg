<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">浙江亲子自驾：8天7晚山海人文美食环线</title>
<desc id="desc">2026年9月25日至10月2日，从杭州出发，经宁波、温州、苍南、缙云、松阳、衢州返回杭州。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f1"/><stop offset="1" stop-color="#edf4ef"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f5f7"/><stop offset="1" stop-color="#cfe8ec"/></linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efe8d4"/><stop offset=".5" stop-color="#e8eed8"/><stop offset="1" stop-color="#dce9d4"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17383e" flood-opacity=".13"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6d78"/></marker>
  <style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183a40}.muted{fill:#667b7c}.tiny{font-size:13px}.small{font-size:15px}.place{font-size:17px;font-weight:760}.poi{font-size:13px;fill:#536c6e}.route{fill:none;stroke:#1f6d78;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.glow{fill:none;stroke:#fff;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:.92}.dayTitle{font-size:17px;font-weight:750}.dayText{font-size:13px;fill:#516b6d}.onDark{fill:#fff!important}</style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<g transform="translate(56 42)"><text x="0" y="33" font-size="34" font-weight="820">浙江亲子自驾 · 山海人文美食休闲环线</text><text x="1" y="66" font-size="17" class="muted">宁波压缩 · 温州慢逛 · 苍南海岸 · 仙都山水 · 松阳古村 · 衢州南孔｜2026.09.25—10.02</text><g transform="translate(1010 2)"><rect width="106" height="37" rx="18" fill="#183a40"/><text x="53" y="24" text-anchor="middle" class="onDark" font-size="14" font-weight="700">8天7晚</text><rect x="116" width="132" height="37" rx="18" fill="#e6aa52"/><text x="182" y="24" text-anchor="middle" font-size="14" font-weight="700">亲子慢旅行</text></g></g>
<g transform="translate(42 125)">
  <rect width="1038" height="820" rx="30" fill="url(#sea)" filter="url(#shadow)"/>
  <path d="M0 0 H502 C540 39 583 76 657 95 C739 116 810 141 861 189 C897 223 899 259 884 302 C867 351 807 389 763 425 C704 473 659 509 610 574 C563 636 528 704 501 820 H0 Z" fill="url(#land)"/>
  <text x="56" y="62" font-size="13" class="muted" letter-spacing="2">路线为地理示意 · 实际车程以当天导航为准</text>
  <path class="glow" d="M210 96 C430 55 700 90 875 205"/><path class="glow" d="M875 205 C780 350 610 500 480 607"/><path class="glow" d="M480 607 C475 660 468 715 457 750"/><path class="glow" d="M457 750 C360 690 280 570 221 457"/><path class="glow" d="M221 457 C205 520 195 585 205 645"/><path class="glow" d="M205 645 C150 585 118 500 125 395"/><path class="glow" d="M125 395 C145 270 176 170 210 96"/>
  <path class="route" d="M210 96 C430 55 700 90 875 205"/><path class="route" d="M875 205 C780 350 610 500 480 607"/><path class="route" d="M480 607 C475 660 468 715 457 750"/><path class="route" d="M457 750 C360 690 280 570 221 457"/><path class="route" d="M221 457 C205 520 195 585 205 645"/><path class="route" d="M205 645 C150 585 118 500 125 395"/><path class="route" d="M125 395 C145 270 176 170 210 96"/>
  <g transform="translate(210 96)"><circle r="24" fill="#183a40" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" class="onDark">1</text></g><g transform="translate(52 92)"><rect width="135" height="62" rx="16" fill="#fff"/><text x="16" y="26" class="place">杭州</text><text x="16" y="48" class="poi">起点 / 终点</text></g>
  <g transform="translate(875 205)"><circle r="27" fill="#e6aa52" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800">2</text></g><g transform="translate(680 105)"><rect width="280" height="88" rx="18" fill="#fff"/><text x="18" y="29" class="place">宁波 · 住1晚</text><text x="18" y="55" class="poi">天一阁｜东钱湖＋韩岭</text><text x="18" y="76" class="tiny" fill="#d65a42">D2午后直接去温州</text></g>
  <g transform="translate(480 607)"><circle r="27" fill="#ef8d68" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800">3</text></g><g transform="translate(545 520)"><rect width="292" height="92" rx="18" fill="#fff"/><text x="18" y="29" class="place">温州 · 住2晚</text><text x="18" y="55" class="poi">江心屿｜公园路｜五马街</text><text x="18" y="77" class="poi">鱼丸 · 灯盏糕 · 糯米饭</text></g>
  <g transform="translate(457 750)"><circle r="27" fill="#ef6f55" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" class="onDark">4</text></g><g transform="translate(530 680)"><rect width="300" height="88" rx="18" fill="#fff"/><text x="18" y="29" class="place">苍南 · 住1晚</text><text x="18" y="55" class="poi">浙南168短段｜海岸日落</text><text x="18" y="76" class="poi">只开漂亮一段，不刷全线</text></g>
  <g transform="translate(221 457)"><circle r="27" fill="#76956b" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" class="onDark">5</text></g><g transform="translate(35 325)"><rect width="305" height="92" rx="18" fill="#fff"/><text x="18" y="29" class="place">缙云仙都 · 住1晚</text><text x="18" y="55" class="poi">D5午后轻走＋D6晨景</text><text x="18" y="76" class="poi">朱潭山｜倪翁洞｜溪边田野</text></g>
  <g transform="translate(205 645)"><circle r="27" fill="#7d9d6e" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" class="onDark">6</text></g><g transform="translate(35 668)"><rect width="285" height="88" rx="18" fill="#fff"/><text x="18" y="29" class="place">松阳 · 住1晚</text><text x="18" y="55" class="poi">古堰画乡｜松阳老街</text><text x="18" y="76" class="poi">杨家堂/松庄最多选2个</text></g>
  <g transform="translate(125 395)"><circle r="27" fill="#8b7858" stroke="#fff" stroke-width="5"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" class="onDark">7</text></g><g transform="translate(25 225)"><rect width="260" height="88" rx="18" fill="#fff"/><text x="18" y="29" class="place">衢州 · 住1晚</text><text x="18" y="55" class="poi">水亭门｜南孔｜博物馆</text><text x="18" y="76" class="poi">老城＋衢州菜收尾</text></g>
  <g transform="translate(380 150)"><rect width="272" height="52" rx="16" fill="#fff7df" stroke="#e2c990"/><text x="136" y="22" text-anchor="middle" font-size="13" font-weight="750">10/1—10/2 国庆车流预警</text><text x="136" y="40" text-anchor="middle" class="tiny">古村停车与衢州返杭留弹性</text></g>
</g>
<g transform="translate(1110 125)"><rect width="448" height="820" rx="30" fill="#fffdf8" filter="url(#shadow)"/><text x="30" y="46" font-size="22" font-weight="820">8天节奏</text><text x="30" y="72" class="small muted">每天一个主任务，转场尽量控制在2—3小时</text><line x1="46" y1="108" x2="46" y2="735" stroke="#d4e1dc" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(28 95)"><circle cx="18" cy="20" r="18" fill="#183a40"/><text x="18" y="26" text-anchor="middle" class="onDark" font-size="13" font-weight="800">D1</text><text x="54" y="16" class="dayTitle">9/25 杭州 → 宁波</text><text x="54" y="38" class="dayText">天一阁＋老城，住宁波</text></g>
  <g transform="translate(28 176)"><circle cx="18" cy="20" r="18" fill="#e6aa52"/><text x="18" y="26" text-anchor="middle" font-size="13" font-weight="800">D2</text><text x="54" y="16" class="dayTitle">9/26 宁波 → 温州</text><text x="54" y="38" class="dayText">东钱湖/韩岭；午后转场</text></g>
  <g transform="translate(28 257)"><circle cx="18" cy="20" r="18" fill="#ef8d68"/><text x="18" y="26" text-anchor="middle" font-size="13" font-weight="800">D3</text><text x="54" y="16" class="dayTitle">9/27 温州慢玩</text><text x="54" y="38" class="dayText">江心屿＋老城＋小吃</text></g>
  <g transform="translate(28 338)"><circle cx="18" cy="20" r="18" fill="#ef6f55"/><text x="18" y="26" text-anchor="middle" class="onDark" font-size="13" font-weight="800">D4</text><text x="54" y="16" class="dayTitle">9/28 温州 → 苍南</text><text x="54" y="38" class="dayText">168海岸线慢开，住海边</text></g>
  <g transform="translate(28 419)"><circle cx="18" cy="20" r="18" fill="#76956b"/><text x="18" y="26" text-anchor="middle" class="onDark" font-size="13" font-weight="800">D5</text><text x="54" y="16" class="dayTitle">9/29 苍南 → 缙云</text><text x="54" y="38" class="dayText">全程最长转场；午后仙都</text></g>
  <g transform="translate(28 500)"><circle cx="18" cy="20" r="18" fill="#7d9d6e"/><text x="18" y="26" text-anchor="middle" class="onDark" font-size="13" font-weight="800">D6</text><text x="54" y="16" class="dayTitle">9/30 缙云 → 松阳</text><text x="54" y="38" class="dayText">晨景＋古堰画乡＋老街</text></g>
  <g transform="translate(28 581)"><circle cx="18" cy="20" r="18" fill="#8b7858"/><text x="18" y="26" text-anchor="middle" class="onDark" font-size="13" font-weight="800">D7</text><text x="54" y="16" class="dayTitle">10/1 松阳 → 衢州</text><text x="54" y="38" class="dayText">古村1—2个；下午逛衢州</text></g>
  <g transform="translate(28 662)"><circle cx="18" cy="20" r="18" fill="#1f6d78"/><text x="18" y="26" text-anchor="middle" class="onDark" font-size="13" font-weight="800">D8</text><text x="54" y="16" class="dayTitle">10/2 衢州 → 杭州</text><text x="54" y="38" class="dayText">南孔/博物馆；午饭后返杭</text></g>
  <rect x="30" y="742" width="388" height="52" rx="14" fill="#fff7df" stroke="#e2c990"/><text x="224" y="764" text-anchor="middle" class="tiny" font-weight="750">国庆假期：返杭时间不设死线</text><text x="224" y="784" text-anchor="middle" class="tiny">以实时高速路况为准，宁可多休息也不赶路</text>
</g>
<text x="56" y="978" class="tiny muted">示意图不替代导航。沿海天气、景区开放、古村停车与国庆高速路况，请在出发前48小时复核。</text><text x="1544" y="978" text-anchor="end" class="tiny muted">路线版本 v2 · 2026-08-29</text>
</svg>